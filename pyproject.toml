[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argo-personal-ops"
version = "0.1.0"
description = "IR local music voice controller for Dandi"
requires-python = ">=3.11"
dependencies = [
    "sounddevice==0.5.5",
    "vosk==0.3.45",
]

[project.optional-dependencies]
dev = ["ruff"]
windows = [
    "winrt-Windows.Media.Control==3.2.1; platform_system == 'Windows'",
    "winrt-Windows.Foundation==3.2.1; platform_system == 'Windows'",
    "winrt-Windows.Foundation.Collections==3.2.1; platform_system == 'Windows'",
    "pycaw==20251023; platform_system == 'Windows'",
]

[project.scripts]
argo-voice = "argo.voice_runtime:main"

[tool.setuptools.packages.find]
include = ["argo*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]
