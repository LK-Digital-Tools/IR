[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argo-personal-ops"
version = "0.1.0"
description = "IR local music voice controller for Dandi"
requires-python = ">=3.11"
dependencies = [
    "sounddevice==0.5.5",
    "vosk==0.3.45",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
argo-voice = "argo.voice_runtime:main"

[tool.setuptools.packages.find]
include = ["argo*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]
